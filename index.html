<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- user-scalable=no stops accidental pinch/double-tap zoom while dancing -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <title>Disintegration</title>
  <!-- Silkscreen: a small pixel font for the settings menu -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="module" crossorigin src="./assets/index-Bdh7-0KO.js"></script>
</head>
<body>
  <!-- The whole screen is one big button. -->
  <main id="stage">
    <canvas id="wave"></canvas>
    <div id="frost"></div>
    <div id="label">tap to record</div>
    <div id="sublabel"></div>
    <div id="progress"><div id="progress-fill"></div></div>
  </main>

  <!-- A small square of pixels in the corner opens the settings. -->
  <button id="settings-button" aria-label="Settings"></button>

  <div id="settings" hidden>
    <h2>settings</h2>

    <!-- Each dropdown is shown as a row of blocks to tap (see settings.js). -->
    <div class="field">
      <span class="name">recording</span>
      <select id="record-mode">
        <option value="tap">tap start/stop</option>
        <option value="always">always listening</option>
      </select>
    </div>

    <label class="field">
      <span class="name">max recording length</span>
      <span class="row"><input id="max-record" type="range" min="2" max="60" step="1"> <output id="max-record-out"></output></span>
    </label>

    <label class="field">
      <span class="name">decay length</span>
      <span class="row"><input id="decay" type="range" min="30" max="1200" step="30"> <output id="decay-out"></output></span>
    </label>

    <div class="field">
      <span class="name">each new phrase</span>
      <select id="new-phrase">
        <option value="fresh">starts fresh</option>
        <option value="continue">continues decay</option>
      </select>
    </div>

    <div class="field">
      <span class="name">ghosts of earlier phrases</span>
      <select id="ghosts">
        <option value="on">on</option>
        <option value="off">off</option>
      </select>
    </div>

    <button id="settings-close">done</button>
  </div>

</body>
</html>
